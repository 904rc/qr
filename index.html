<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weiterleitung zu 904.running.clu...</title>
    
    <!-- Meta-Weiterleitung: Leitet nach 0 Sekunden weiter -->
    <meta http-equiv="refresh" content="0; url=https://www.instagram.com/904.running.clu/">
    
    <!-- JavaScript-Fallback: Greift, falls der Browser Meta-Weiterleitungen blockiert -->
    <script type="text/javascript">
        window.location.href = "https://www.instagram.com/904.running.clu/";
    </script>
    
    <!-- Ein bisschen CSS für die Ladeanzeige -->
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            padding-top: 20vh;
            background-color: #fafafa;
            color: #262626;
        }
        a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover {
            text-decoration: underline;
        }
        .spinner {
            margin: 20px auto;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-top: 4px solid #0095f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2>Du wirst zu Instagram weitergeleitet...</h2>
    <p>Falls du nicht automatisch weitergeleitet wirst, klicke bitte hier:</p>
    
    <!-- Manueller Klick-Fallback -->
    <p><a href="https://www.instagram.com/904.running.clu/">Zu 904.running.clu auf Instagram</a></p>
</body>
</html>
